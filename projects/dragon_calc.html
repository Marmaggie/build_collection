<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragon Calculator</title>
    <link rel="stylesheet" href="../css/dragon_calc.css">
</head>
<body>
    <main>
    <div class="calculator-wrapper">
        <img src="../images/border.png" alt="A dragon that borders the calculator" class="dragon-border">
        <div class="background">
            <div class="display">
                <p id="display-text">0</p>
            </div>
            <div id="buttons">
                <button id="one">1</button>
                <button id="two">2</button>
                <button id="three">3</button>
                <button id="add">+</button>

                <button id="four">4</button>
                <button id="five">5</button>
                <button id="six">6</button>
                <button id="subtract">−</button>

                <button id="seven">7</button>
                <button id="eight">8</button>
                <button id="nine">9</button>
                <button id="multiply">×</button>

                <button id="zero">0</button>
                <button id="decimal">.</button>
                <button id="clear">C</button>
                <button id="divide">÷</button>

                <button id="equals">=</button>
            </div>
        </div>
    </div>
    </main>
<script src="../javascript/dragon_calc.js"></script>
</body>
</html>
