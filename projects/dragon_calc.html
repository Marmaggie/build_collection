<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragon Calculator</title>
    <link rel="stylesheet" href="../css/dragon_calc.css">
</head>
<body>
    <main>
        <div class="background">
            <h1>A lot of stuff will go here</h1>
            <h2>Display</h2>
            <div class="display">
                <p id="display-text">0</p>
            </div>
            <div id="buttons">
                <button id="clear">C</button>
                <button id="divide">/</button>
                <button id="multiply">*</button>
                <button id="subtract">-</button>
                <button id="add">+</button>
                <button id="equals">=</button>
            </div>

        </div>
    </main>
<script src="../javascript/dragon_calc.js"></script>
</body>
</html>
